# File: configs/mdlm_gla.yaml
# MDLM with Bidirectional Gated Linear Attention backbone
# Key: data-dependent gates (unlike RWKV's fixed decay)
# Pure PyTorch — no custom CUDA kernels needed
defaults:
  - logging: default
  - data: owt
  - model: small
  - optimizer: adam
  - _self_

data:
  dataset_name: "json"
  data_files:
    train: "/inspire/hdd/project/future-reading/zhangjiaquan-253108540222/jiaquan/latent/DLM-mmdit/mmdit_latent/data/train_data.jsonl"
    validation: "/inspire/hdd/project/future-reading/zhangjiaquan-253108540222/jiaquan/latent/DLM-mmdit/mmdit_latent/data/validation_data.jsonl"
  streaming: false

model:
  type: diffusion
  backbone: gla  # Bidirectional Gated Linear Attention
  diffusion_process: mdlm
  t_eps: 1e-4
  mlp_ratio: 4
  gla_chunk_size: 64  # chunk size for parallel scan

training:
  resume: null
  seed: 1
  train_batch_size: 64
  eval_batch_size: 64
  num_train_steps: 1131_000
  lr_schedule: cosine
  warmup_steps: 10000
  low_discrepancy_sampling: True
  dtype: bf16
  compile_model: false  # Sequential scan doesn't benefit from compile

loss:
  loss_type: mdlm
  loss_scale: 1.0
  reduction: tokenmean
